<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토이 1호:첫 웹페이지</title>
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <section>
    <h1>하이의 첫 웹페이지</h1>
    <p>웹 개발을 시작했습니다!</p>
    <!-- <b>: 굵은 단어 -->
    <p>오늘은 <b>좋은 날</b>입니다.</p>
  </section>
  
  <section>
    <h2>오늘 할 일</h2>
    <!-- 리스트 만들기 -->
    <ul> <!-- 리스트 틀 -->
      <li> 책 읽기 </li> 
      <li> 산책하기 </li> 
      <li> 걷기 </li> 
      <li> 숨쉬기 </li> 
      <li> 명상하기 </li> 
    </ul>
  	<!-- 03. 입력창과 버튼 만들기 -->
  	<label for="nickname">별명</label>
  	<input id="nickname" type="text" placeholder="별명을 입력하세요">
  	<button type="button">인사하기</button>
  </section>
</body>
</html>
