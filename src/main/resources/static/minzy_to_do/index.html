<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>토이 1호:첫 웹페이지</title>
  <link rel="stylesheet" href="./css/style.css">
  
</head>

<body>
  <section>
    <h1>하이의 첫 웹페이지</h1>
    <p>웹 개발을 시작했습니다!</p>
    <!-- <b>: 굵은 단어 -->
    <p>오늘은 <b>좋은 날</b>입니다.</p>
  </section>
  
  <section>
    <h2>오늘 할 일</h2>
    <!-- 리스트 만들기 -->
    <ul> <!-- 리스트 틀 -->
      <li> 책 읽기 </li> 
      <li> 산책하기 </li> 
      <li> 걷기 </li> 
      <li> 숨쉬기 </li> 
      <li> 명상하기 </li> 
    </ul>
  	<!-- 03. 입력창과 버튼 만들기 -->
  	<label for="nickname">별명</label>
  	<input id="nickname" type="text" placeholder="별명을 입력하세요">
  	<button id="helloButton" type="button" >인사하기</button>
  </section>
  
   <div class="card">
    <h2>오늘의 할일</h2>
    <p>배고파</p>
  </div>
 
 <!-- 객체와 배열 -->
 <div class="card">
 	<button id="button1">첫번째 배열 요소값 출력</button>
 	<button id="button2">두번째 배열 요소값 출력</button>
 	<button id="button3">세번째 배열 요소값 출력</button>
 </div>
 
  <script src="./js/app.js"></script>
    <!-- 1. css는 화면을 꾸미기 때문에 제일 먼저 나와야함(로드) 
         2. html 태그는 구조를 만든다 css 파일 다음에 와야함
         3. js는 html 구조가 만들어져야 작동한다. 
            따라서 '</body>' 태그 바로 위에 오는 것이 좋음
     -->
</body>
</html>
